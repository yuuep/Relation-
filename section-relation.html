<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relationship</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{--bordeaux:#340a12;--bordeaux-deep:#1f050a;--creme:#f1e8df;--creme-soft:rgba(241,232,223,.55);--ligne:rgba(241,232,223,.16)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:'Cormorant Garamond',Georgia,serif;color:var(--creme);padding:2px}
  .carte{background:var(--bordeaux);border:1.5px solid var(--bordeaux-deep);box-shadow:inset 0 0 0 5px var(--bordeaux),inset 0 0 0 6px var(--creme-soft);border-radius:500px 500px 14px 14px;padding:34px 12px 10px;max-width:260px;margin:0 auto}
  h1{font-weight:600;font-size:16px;letter-spacing:.06em;text-align:center;line-height:1.15}
  .etoile{display:block;text-align:center;font-size:11px;color:var(--creme-soft);margin:1px 0 4px;line-height:1}
  ul{list-style:none}
  li+li{border-top:1px solid var(--ligne)}
  a{display:flex;align-items:center;gap:7px;padding:3px 2px;color:var(--creme);text-decoration:none;font-size:14px;line-height:17px;white-space:nowrap;overflow:hidden}
  a span.t{overflow:hidden;text-overflow:ellipsis}
  a span.i{flex:none;width:18px;text-align:center;font-size:12px}
  a:focus-visible{outline:1.5px solid var(--creme);outline-offset:1px;border-radius:4px}
</style>
</head>
<body>
  <div class="carte">
    <h1>Relationship</h1>
    <span class="etoile">✦</span>
    <ul>
      <li><a href="https://www.notion.so/18a83c5919ff80c5a20de1cc097db363" target="_blank" rel="noopener"><span class="i">🎄</span><span class="t">Budget Noël</span></a></li>
      <li><a href="https://www.notion.so/19083c5919ff81e091a1f14b8faaa973" target="_blank" rel="noopener"><span class="i">🎁</span><span class="t">Trousse de survie des Fêtes</span></a></li>
      <li><a href="https://www.notion.so/19083c5919ff815989c6fc3c5aecc457" target="_blank" rel="noopener"><span class="i">💞</span><span class="t">Relationship</span></a></li>
      <li><a href="https://www.notion.so/19083c5919ff818eae00ca2d1e6dc6f2" target="_blank" rel="noopener"><span class="i">💍</span><span class="t">Wedding planning</span></a></li>
      <li><a href="https://www.notion.so/19083c5919ff81f4b915f9461f1c3171" target="_blank" rel="noopener"><span class="i">👩‍👧</span><span class="t">Mom’s organization</span></a></li>
